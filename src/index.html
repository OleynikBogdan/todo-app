<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo MVC</title>
    <link rel="icon" href="data:," />

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles/css.css" />

    <script
      src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="./scripts/main.js" type="module" defer></script>
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <header class="mb-4">
            <h1 class="fw-bold">My Todo List</h1>
            <p class="text-secondary">Todo List built with MVC architecture</p>
          </header>

          <section class="card shadow-sm mb-4">
            <div class="card-body">
              <h2 class="h5 mb-3">New Task</h2>

              <form data-create-form>
                <div class="mb-3">
                  <label for="todo-title" class="form-label">Title</label>
                  <input
                    id="todo-title"
                    name="title"
                    type="text"
                    class="form-control"
                    placeholder="Enter task title"
                    required
                    maxlength="150"
                  />
                </div>

                <div class="mb-3">
                  <label for="todo-description" class="form-label"
                    >Description</label
                  >
                  <textarea
                    id="todo-description"
                    name="description"
                    class="form-control"
                    rows="2"
                    placeholder="Task description (optional)"
                  ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Add task</button>
              </form>
            </div>
          </section>

          <form class="mb-3" data-search-form>
            <label for="todo-search" class="form-label">Search Tasks</label>
            <input
              id="todo-search"
              type="search"
              name="search"
              class="form-control"
              placeholder="Search by title..."
            />
          </form>

          <div class="d-flex flex-wrap gap-2 mb-3" aria-label="Task filters">
            <button
              type="button"
              class="btn btn-outline-primary active"
              data-filter="all"
              aria-pressed="true"
            >
              All
            </button>

            <button
              type="button"
              class="btn btn-outline-primary"
              data-filter="active"
              aria-pressed="false"
            >
              Active
            </button>

            <button
              type="button"
              class="btn btn-outline-primary"
              data-filter="completed"
              aria-pressed="false"
            >
              Completed
            </button>
          </div>

          <section class="card shadow-sm">
            <div class="card-body">
              <div class="list-group list-group-flush" data-todo-list>
                <p class="text-secondary">Loading tasks...</p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div
      class="modal fade"
      id="editTodoModal"
      tabindex="-1"
      aria-labelledby="editTodoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="editTodoModalLabel">Edit Task</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <form data-edit-form>
            <div class="modal-body">
              <input type="hidden" name="id" />

              <div class="mb-3">
                <label for="edit-todo-title" class="form-label">Title</label>
                <input
                  id="edit-todo-title"
                  name="title"
                  type="text"
                  class="form-control"
                  required
                  maxlength="150"
                />
              </div>

              <div class="mb-3">
                <label for="edit-todo-description" class="form-label"
                  >Description</label
                >
                <textarea
                  id="edit-todo-description"
                  name="description"
                  class="form-control"
                  rows="3"
                ></textarea>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>

              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="deleteTodoModal"
      tabindex="-1"
      aria-labelledby="deleteTodoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="deleteTodoModalLabel">
              Confirm Deletion
            </h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <p data-delete-modal-title></p>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="button" class="btn btn-danger" data-delete-submit>
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
